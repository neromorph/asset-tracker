name: asset_tracker
description: Family asset manager with billing and document expiry tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.4

  # Navigation
  go_router: ^14.0.0

  # Database - Offline first
  drift: ^2.15.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.18
  sqlcipher_flutter_libs: ^0.6.0

  # Backend
  supabase_flutter: ^2.3.4
  flutter_dotenv: ^5.1.0

  # Security
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.1.8

  # UI
  google_fonts: ^6.1.0
  tabler_icons: ^2.41.0
  table_calendar: ^3.0.9
  fl_chart: ^0.66.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_slidable: ^3.0.1

  # Utilities
  timezone: ^0.9.2
  intl: ^0.19.0
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  file_picker: ^6.1.1
  open_filex: ^4.4.0
  connectivity_plus: ^5.0.2
  flutter_local_notifications: ^16.3.2
  logger: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.11
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  generate: true
