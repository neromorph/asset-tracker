name: asset_tracker
description: Family asset manager with billing and document expiry tracking
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: any

  # Database - Offline first
  drift: any
  drift_flutter: any
  sqlite3_flutter_libs: any

  # Backend
  supabase_flutter: any
  flutter_dotenv: any

  # Security
  flutter_secure_storage: any
  local_auth: any

  # UI
  google_fonts: any
  tabler_icons: any
  table_calendar: any
  fl_chart: any
  cached_network_image: any
  shimmer: any
  flutter_slidable: any

  # Utilities
  timezone: any
  intl: any
  fpdart: any
  freezed_annotation: any
  json_annotation: any
  file_picker: any
  open_filex: any
  connectivity_plus: any
  flutter_local_notifications: ^18.0.1
  logger: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: any
  flutter_lints: any
  build_runner: any
  drift_dev: any
  freezed: any
  json_serializable: any
  mocktail: any

flutter:
  uses-material-design: true